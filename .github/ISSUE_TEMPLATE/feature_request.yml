name: 💡 Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to achieve, not just the solution.
      placeholder: When I stream with dual output, I'd like to...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: streamlabs
    attributes:
      label: Does Streamlabs (or another app) do this?
      description: If so, how? Screenshots help.
