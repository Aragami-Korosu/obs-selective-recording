name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set the webcam video route to "Stream only"
        2. Start recording
        3. ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: obs-version
    attributes:
      label: OBS Studio version
      description: Help → About
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: OBS log URL
      description: Help → Log Files → Upload Current Log File
